name: Diagnose SuSFS state

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chihiro-rebase
          fetch-depth: 1

      - name: Diagnosa simbol SuSFS
        shell: bash
        run: |
          for s in susfs_get_data_path susfs_open_redirect_spoof_vfs_statfs \
                   susfs_open_redirect_spoof_seq_show statfs_by_dentry_wrapper \
                   calculate_f_flags_wrapper fake_state; do
            echo "=================== $s"
            grep -rn "$s" --include=*.c --include=*.h . | head -8
          done

          echo "=== Guard di sekitar susfs_get_data_path di susfs.c ==="
          grep -n "^#if\|^#endif\|^#else\|susfs_get_data_path\|open_redirect_spoof" fs/susfs.c | head -80

          echo "=== Kconfig SuSFS yang tersedia ==="
          grep -rhn "^config KSU_SUSFS" --include=Kconfig* . | sort -u

          echo "=== fs/Makefile ==="
          grep -n "susfs" fs/Makefile

          echo "=== Hasil gki_defconfig + olddefconfig ==="
          make O=out ARCH=arm64 gki_defconfig >/dev/null 2>&1
          grep -n "SUSFS\|CONFIG_KSU" out/.config | head -40

          echo "=== Versi ==="
          grep -rn "SUSFS_VERSION" include/linux/susfs*.h
